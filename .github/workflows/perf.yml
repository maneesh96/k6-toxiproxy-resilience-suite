name: Performance Suite

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check scripts
        run: |
          for f in *.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose --profile load config --quiet

      - name: Build service image
        run: docker compose build

      - name: Validate k6 script and options
        run: docker compose --profile load run --rm --no-deps k6 inspect /scripts/load-test.js

      # Short durations: this proves the orchestration end to end (stack
      # healthchecks, proxy setup, all four phases, summaries written), not
      # the performance numbers themselves.
      - name: Run resilience suite (smoke durations)
        env:
          VUS: "5"
          RAMP_UP: 2s
          DURATION: 5s
          RAMP_DOWN: 2s
          KEEP_STACK_UP: "1"
        run: |
          npm run suite
          cat results/phases.json

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
